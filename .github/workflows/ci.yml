name: Rust CI

on:
  push:
    branches:
    - "main"
    - "renovate/**"
  pull_request:

permissions:
  contents: write
  checks: write

jobs:
  fmt:
    name: Check Formatting
    runs-on: ubuntu-latest

    steps:
    - name: Check out
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Rust (stable)
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

    - name: Cache build artifacts
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    - name: Format Code
      run: cargo fmt --all -- --check

  clippy:
    name: Check Clippy
    runs-on: ubuntu-latest

    steps:
    - name: Check out
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Rust (stable)
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

    - name: Cache build artifacts
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    - name: Run Clippy
      run: cargo clippy --all -- -D warnings

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [fmt, clippy]

    steps:
    - name: Check out
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Rust (stable)
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

    - name: Cache build artifacts
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    - name: Main Tests
      run: cargo nextest run --workspace --profile ci

    - name: Doc Tests
      run: cargo test --doc

  pre-commit:
    name: Pre-Commit
    runs-on: ubuntu-latest

    steps:
    - name: Check out
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - uses: andrewaylett/pre-commit-action@0e5d5baf9cb5b8ed949ecd62bc5d57154296d505 # v4
      with:
        extra_args: --all-files --hook-stage pre-merge-commit
